<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CyberEinstein logo mark</title>
  <desc id="desc">A chain of evidence nodes curves around a luminous frontier star.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243C"/>
      <stop offset="1" stop-color="#06101D"/>
    </linearGradient>
    <linearGradient id="chain" x1="104" y1="368" x2="396" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEBFF"/>
      <stop offset="0.58" stop-color="#8F9DFF"/>
      <stop offset="1" stop-color="#B77DFF"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(328 224) rotate(90) scale(74)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7C7"/>
      <stop offset="0.36" stop-color="#F4C95D"/>
      <stop offset="1" stop-color="#F4C95D" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="224" fill="url(#bg)" stroke="#25435F" stroke-width="2"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#1B344D" stroke-width="1" stroke-dasharray="3 11"/>
  <path d="M354 122C240 70 116 139 106 254c-10 118 108 202 214 150" fill="none" stroke="url(#chain)" stroke-width="30" stroke-linecap="round"/>
  <path d="M348 123C255 100 163 155 159 254c-4 91 80 145 160 126" fill="none" stroke="#0A1726" stroke-width="11" stroke-linecap="round" opacity=".95"/>
  <g fill="#071321" stroke="url(#chain)" stroke-width="8">
    <circle cx="126" cy="190" r="17"/>
    <circle cx="111" cy="280" r="17"/>
    <circle cx="154" cy="360" r="17"/>
    <circle cx="239" cy="405" r="17"/>
    <circle cx="327" cy="395" r="17"/>
  </g>
  <path d="M138 188L193 217M125 286l58 7m-18 57 45-38m39 78 7-60m67 49-28-62" stroke="#5EEBFF" stroke-width="4" stroke-linecap="round" opacity=".72"/>
  <circle cx="328" cy="224" r="74" fill="url(#core)"/>
