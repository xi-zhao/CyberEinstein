<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">CyberEinstein — Executable History of Science</title>
  <desc id="desc">Brand banner showing scientific evidence history converging into a new frontier.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091827"/>
      <stop offset=".55" stop-color="#071321"/>
      <stop offset="1" stop-color="#120D2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEBFF"/>
      <stop offset=".62" stop-color="#829BFF"/>
      <stop offset="1" stop-color="#B77DFF"/>
    </linearGradient>
    <radialGradient id="frontier" cx="0" cy="0" r="1" gradientTransform="translate(956 234) rotate(90) scale(116)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8C9" stop-opacity=".92"/>
      <stop offset=".23" stop-color="#F4C95D" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F4C95D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A6D7FF" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="26" fill="url(#hero-bg)"/>
  <rect width="1200" height="520" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="518" rx="25" fill="none" stroke="#28445F" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(76 72)">
      <rect width="232" height="32" rx="16" fill="#102C40" stroke="#2B6176"/>
      <circle cx="18" cy="16" r="4" fill="#5EEBFF"/>
      <text x="32" y="21" fill="#9BEFFF" font-size="12" font-weight="700" letter-spacing="1.8">EVIDENCE-NATIVE AI SCIENTIST</text>
    </g>
    <text x="72" y="188" fill="#F5F8FC" font-size="70" font-weight="750" letter-spacing="-2.4">CyberEinstein</text>
    <rect x="76" y="211" width="448" height="4" rx="2" fill="url(#accent)"/>
    <text x="76" y="270" fill="#DCE8F3" font-size="26" font-weight="560">Executable History of Science</text>
    <text x="76" y="314" fill="#9EB4C7" font-size="18">Inherit how science reached today’s frontier.</text>
    <text x="76" y="342" fill="#9EB4C7" font-size="18">Then conduct the next verifiable study.</text>

    <g transform="translate(76 395)" font-size="12" font-weight="650" letter-spacing=".7">
      <g><rect width="76" height="30" rx="15" fill="#0F2638" stroke="#24465F"/><text x="38" y="20" fill="#C8DAE7" text-anchor="middle">CLAIMS</text></g>
      <g transform="translate(86)"><rect width="68" height="30" rx="15" fill="#0F2638" stroke="#24465F"/><text x="34" y="20" fill="#C8DAE7" text-anchor="middle">CODE</text></g>
      <g transform="translate(164)"><rect width="66" height="30" rx="15" fill="#0F2638" stroke="#24465F"/><text x="33" y="20" fill="#C8DAE7" text-anchor="middle">RUNS</text></g>
      <g transform="translate(240)"><rect width="92" height="30" rx="15" fill="#0F2638" stroke="#24465F"/><text x="46" y="20" fill="#C8DAE7" text-anchor="middle">EVIDENCE</text></g>
      <g transform="translate(342)"><rect width="88" height="30" rx="15" fill="#231F39" stroke="#51406D"/><text x="44" y="20" fill="#DCCBFA" text-anchor="middle">FAILURES</text></g>
      <g transform="translate(440)"><rect width="86" height="30" rx="15" fill="#231F39" stroke="#51406D"/><text x="43" y="20" fill="#DCCBFA" text-anchor="middle">REVIEWS</text></g>
    </g>
  </g>

  <g transform="translate(660 36)">
    <circle cx="296" cy="198" r="116" fill="url(#frontier)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M27 378C104 371 127 308 171 284c48-27 98-5 145-35 31-20 43-41 70-54" stroke="#5EEBFF" stroke-width="3" opacity=".85"/>
      <path d="M35 296c63 5 92-31 142-27 52 4 83 17 130-9 33-18 52-46 79-65" stroke="#839AFF" stroke-width="3" opacity=".68"/>
      <path d="M77 194c59 18 98 4 139 22 44 19 70 39 111 24 25-9 37-26 59-45" stroke="#B77DFF" stroke-width="3" opacity=".62"/>
    </g>
    <g fill="#071321" stroke-width="5">
      <circle cx="29" cy="378" r="12" stroke="#5EEBFF"/><circle cx="82" cy="356" r="12" stroke="#5EEBFF"/><circle cx="131" cy="316" r="12" stroke="#5EEBFF"/><circle cx="178" cy="281" r="12" stroke="#5EEBFF"/><circle cx="235" cy="277" r="12" stroke="#5EEBFF"/>
      <circle cx="35" cy="296" r="10" stroke="#839AFF"/><circle cx="98" cy="286" r="10" stroke="#839AFF"/><circle cx="155" cy="269" r="10" stroke="#839AFF"/>
      <circle cx="77" cy="194" r="9" stroke="#B77DFF"/><circle cx="140" cy="205" r="9" stroke="#B77DFF"/><circle cx="216" cy="216" r="9" stroke="#B77DFF"/>
    </g>
    <g stroke="#6E8DA7" stroke-width="1.5" opacity=".45"><path d="M29 378 35 296 77 194M82 356 98 286 140 205M131 316 155 269 216 216M178 281 235 277"/></g>
    <circle cx="296" cy="198" r="76" fill="none" stroke="#F4C95D" stroke-width="1.5" stroke-dasharray="3 12" opacity=".68"/>
    <g transform="translate(296 198)" filter="url(#soft-glow)">
      <path d="M0-30 8-8 30 0 8 8 0 30-8 8-30 0-8-8Z" fill="#F4C95D"/>
      <circle r="6" fill="#FFFDF1"/>
    </g>
    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <text x="296" y="304" text-anchor="middle" fill="#F8DEA0" font-size="12" font-weight="700" letter-spacing="2">NEXT JUSTIFIED STEP</text>
      <text x="296" y="444" text-anchor="middle" fill="#809AAF" font-size="11" font-weight="650" letter-spacing="1.6">OPEN BY DESIGN · BUILT FOR VERIFIABLE DISCOVERY</text>
    </g>
  </g>
</svg>
