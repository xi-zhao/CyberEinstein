<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Three projects, one scientific evidence chain</title>
  <desc id="desc">PRAgent reconstructs research, RunThePaper validates public evidence, and CyberEinstein conducts new grounded research that returns to the shared history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#081725"/><stop offset="1" stop-color="#100D24"/></linearGradient>
    <linearGradient id="flow" x1="92" y1="0" x2="1108" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEBFF"/><stop offset=".55" stop-color="#8B99FF"/><stop offset="1" stop-color="#F4C95D"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7390A9"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#29445D" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="58" fill="#F4F8FC" font-size="24" font-weight="700">Three projects. One scientific evidence chain.</text>
    <text x="56" y="84" fill="#91A9BC" font-size="14">The moat compounds when reproduction, validation, and discovery share the same history.</text>

    <path d="M362 216h70M768 216h70" stroke="#7390A9" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1020 318c-113 74-636 77-844 2" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)" opacity=".72"/>

    <g transform="translate(82 126)">
      <rect width="280" height="192" rx="20" fill="#0C2738" stroke="#28576B"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#14384B"/>
      <path d="M31 32h20M31 41h14M31 50h18" stroke="#62E8F7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="78" y="49" fill="#EFF7FB" font-size="22" font-weight="700">PRAgent</text>
      <text x="20" y="91" fill="#6FEAF7" font-size="11" font-weight="700" letter-spacing="1.5">RECONSTRUCT</text>
      <text x="20" y="122" fill="#C8D7E2" font-size="15">Papers and Claims become</text>
      <text x="20" y="146" fill="#C8D7E2" font-size="15">runnable ReproductionCases.</text>
      <text x="20" y="174" fill="#819CAF" font-size="12">historical evidence engine</text>
    </g>
    <g transform="translate(432 126)">
      <rect width="336" height="192" rx="20" fill="#121F3A" stroke="#3E4E7B"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#202D51"/>
      <circle cx="41" cy="41" r="11" fill="none" stroke="#9B9DFF" stroke-width="2.5"/><path d="m35 41 4 4 8-9" fill="none" stroke="#9B9DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="49" fill="#EFF7FB" font-size="22" font-weight="700">RunThePaper</text>
      <text x="20" y="91" fill="#9B9DFF" font-size="11" font-weight="700" letter-spacing="1.5">VALIDATE</text>
      <text x="20" y="122" fill="#C8D7E2" font-size="15">Real runs, evidence, failures,</text>
      <text x="20" y="146" fill="#C8D7E2" font-size="15">and boundaries stay public.</text>
      <text x="20" y="174" fill="#819CAF" font-size="12">validation ground · community entry</text>
    </g>
    <g transform="translate(838 126)">
      <rect width="280" height="192" rx="20" fill="#252030" stroke="#756343"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#3D352D"/>
      <path d="M41 27l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z" fill="#F4C95D"/>
      <text x="78" y="49" fill="#FFF7DD" font-size="22" font-weight="700">CyberEinstein</text>
      <text x="20" y="91" fill="#F4C95D" font-size="11" font-weight="700" letter-spacing="1.5">DISCOVER</text>
      <text x="20" y="122" fill="#E6DCC5" font-size="15">Field history grounds the next</text>
      <text x="20" y="146" fill="#E6DCC5" font-size="15">verifiable research step.</text>
      <text x="20" y="174" fill="#A99A7D" font-size="12">scientific discovery system</text>
    </g>

    <rect x="390" y="362" width="420" height="36" rx="18" fill="#111F30" stroke="#31485C"/>
    <circle cx="414" cy="380" r="5" fill="#5EEBFF"/>
    <text x="600" y="385" text-anchor="middle" fill="#BFD0DD" font-size="12" font-weight="700" letter-spacing="1.1">NEW RESULTS RETURN TO THE EXECUTABLE HISTORY</text>
  </g>
</svg>
