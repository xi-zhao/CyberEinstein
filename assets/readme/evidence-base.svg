<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">RunThePaper evidence base</title>
  <desc id="desc">A fixed cohort of 100 physics papers contains 1,427 claims and 3,933 claim checks: 2,068 reproduced, 1,134 objectively blocked, and 731 attempted but not reproduced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#081725"/><stop offset="1" stop-color="#100D24"/></linearGradient>
    <linearGradient id="number" x1="60" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEBFF"/><stop offset="1" stop-color="#9B9DFF"/></linearGradient>
  </defs>
  <rect width="1200" height="470" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="468" rx="23" fill="none" stroke="#29445D" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="58" fill="#F4F8FC" font-size="24" font-weight="700">A real evidence base—not a demo</text>
    <text x="56" y="84" fill="#91A9BC" font-size="14">RunThePaper’s frozen 100-paper physics cohort · terminal accounting for every Claim Check</text>

    <g transform="translate(56 125)">
      <text x="0" y="90" fill="url(#number)" font-size="108" font-weight="760" letter-spacing="-5">100</text>
      <text x="245" y="61" fill="#F2F7FB" font-size="25" font-weight="700">paper cases</text>
      <text x="247" y="91" fill="#8FA8BA" font-size="14">the first executable segment</text>
      <text x="247" y="112" fill="#8FA8BA" font-size="14">of scientific history</text>
    </g>

    <g transform="translate(56 282)">
      <g><text x="0" y="35" fill="#F0F6FA" font-size="34" font-weight="720">1,427</text><text x="0" y="60" fill="#8FA8BA" font-size="13">AUTHORED CLAIMS</text></g>
      <g transform="translate(190)"><text x="0" y="35" fill="#F0F6FA" font-size="34" font-weight="720">3,933</text><text x="0" y="60" fill="#8FA8BA" font-size="13">CLAIM CHECKS</text></g>
      <g transform="translate(380)"><text x="0" y="35" fill="#F0F6FA" font-size="34" font-weight="720">0</text><text x="0" y="60" fill="#8FA8BA" font-size="13">PENDING</text></g>
    </g>

    <g transform="translate(620 132)">
      <text x="0" y="18" fill="#D8E4EC" font-size="15" font-weight="650">Terminal outcomes across 3,933 checks</text>
      <rect x="0" y="46" width="500" height="52" rx="10" fill="#132335"/>
      <path d="M0 56a10 10 0 0 1 10-10h253v52H10A10 10 0 0 1 0 88Z" fill="#45CDA3"/>
      <rect x="263" y="46" width="144" height="52" fill="#E5A64F"/>
      <path d="M407 46h83a10 10 0 0 1 10 10v32a10 10 0 0 1-10 10h-83Z" fill="#D9688A"/>
      <g font-size="12" font-weight="750">
        <text x="16" y="78" fill="#05241B">52.58%</text>
        <text x="279" y="78" fill="#312009">28.83%</text>
        <text x="423" y="78" fill="#32101C">18.59%</text>
      </g>
      <g transform="translate(0 132)">
        <circle cx="7" cy="7" r="7" fill="#45CDA3"/><text x="24" y="12" fill="#D5E0E8" font-size="14" font-weight="650">2,068 reproduced</text>
        <text x="24" y="34" fill="#829BAE" font-size="12">evidence supports the scoped Claim</text>
      </g>
      <g transform="translate(0 198)">
        <circle cx="7" cy="7" r="7" fill="#E5A64F"/><text x="24" y="12" fill="#D5E0E8" font-size="14" font-weight="650">1,134 objectively blocked</text>
        <text x="24" y="34" fill="#829BAE" font-size="12">the blocker remains explicit and reusable</text>
      </g>
      <g transform="translate(260 132)">
        <circle cx="7" cy="7" r="7" fill="#D9688A"/><text x="24" y="12" fill="#D5E0E8" font-size="14" font-weight="650">731 attempted, not reproduced</text>
        <text x="24" y="34" fill="#829BAE" font-size="12">failed attempts remain negative knowledge</text>
      </g>
      <g transform="translate(260 198)">
        <circle cx="7" cy="7" r="7" fill="#8B99FF"/><text x="24" y="12" fill="#D5E0E8" font-size="14" font-weight="650">100% terminal accounting</text>
        <text x="24" y="34" fill="#829BAE" font-size="12">every check maps to a Claim and outcome</text>
      </g>
    </g>

    <line x1="56" y1="402" x2="1144" y2="402" stroke="#263D52"/>
    <text x="56" y="432" fill="#829BAE" font-size="12">Successful numerical-Claim coverage: 40.55%</text>
    <text x="610" y="432" fill="#829BAE" font-size="12">Conditional Fidelity: 92.97 / 100 · eligible evidence coverage: 23.37%</text>
  </g>
</svg>
