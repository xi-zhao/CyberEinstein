<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">The Executable History of Science</title>
  <desc id="desc">Scientific sources become claims, executable methods, runs, evidence, field state, and grounded research opportunities. Failures remain in the history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#081725"/><stop offset="1" stop-color="#0D1025"/></linearGradient>
    <linearGradient id="line" x1="160" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEBFF"/><stop offset=".58" stop-color="#8599FF"/><stop offset="1" stop-color="#F4C95D"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#668AA6"/></marker>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#29445D" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="58" fill="#F4F8FC" font-size="24" font-weight="700">The Executable History of Science</text>
    <text x="56" y="84" fill="#91A9BC" font-size="14">Not a folder of papers—a living chain of what was claimed, run, challenged, and learned.</text>

    <path d="M164 214H1032" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#668AA6" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M238 214h52"/><path d="M410 214h52"/><path d="M582 214h52"/><path d="M754 214h52"/><path d="M926 214h52"/>
    </g>

    <g transform="translate(72 144)">
      <rect width="166" height="140" rx="16" fill="#0D2638" stroke="#27546B"/>
      <text x="20" y="31" fill="#70E8F6" font-size="11" font-weight="700" letter-spacing="1.5">SCIENTIFIC RECORD</text>
      <text x="20" y="62" fill="#EEF6FB" font-size="18" font-weight="650">Sources</text>
      <text x="20" y="88" fill="#9FB4C5" font-size="13">papers · notebooks</text>
      <text x="20" y="109" fill="#9FB4C5" font-size="13">datasets · prior code</text>
    </g>
    <g transform="translate(290 144)">
      <rect width="120" height="140" rx="16" fill="#10233A" stroke="#315275"/>
      <circle cx="60" cy="42" r="16" fill="#132C47" stroke="#6EC7F4" stroke-width="2"/>
      <path d="M51 42h18M60 33v18" stroke="#6EC7F4" stroke-width="2"/>
      <text x="60" y="85" text-anchor="middle" fill="#F0F6FB" font-size="17" font-weight="650">Claims</text>
      <text x="60" y="108" text-anchor="middle" fill="#91A9BC" font-size="12">dependencies</text>
    </g>
    <g transform="translate(462 144)">
      <rect width="120" height="140" rx="16" fill="#121F3A" stroke="#3B4B79"/>
      <path d="m42 39 12-10v20Zm36 0L66 29v20Z" fill="#829BFF" opacity=".95"/>
      <text x="60" y="85" text-anchor="middle" fill="#F0F6FB" font-size="17" font-weight="650">Methods</text>
      <text x="60" y="108" text-anchor="middle" fill="#91A9BC" font-size="12">code · parameters</text>
    </g>
    <g transform="translate(634 144)">
      <rect width="120" height="140" rx="16" fill="#151D39" stroke="#4A4778"/>
      <path d="M44 28h32v28H44z" fill="none" stroke="#A98DFF" stroke-width="2"/><path d="m51 48 7-7-7-7m13 14h7" fill="none" stroke="#A98DFF" stroke-width="2"/>
      <text x="60" y="85" text-anchor="middle" fill="#F0F6FB" font-size="17" font-weight="650">Runs</text>
      <text x="60" y="108" text-anchor="middle" fill="#91A9BC" font-size="12">real observations</text>
    </g>
    <g transform="translate(806 144)">
      <rect width="120" height="140" rx="16" fill="#191C36" stroke="#574574"/>
      <path d="m45 41 10 10 22-25" fill="none" stroke="#D08DFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="85" text-anchor="middle" fill="#F0F6FB" font-size="17" font-weight="650">Evidence</text>
      <text x="60" y="108" text-anchor="middle" fill="#91A9BC" font-size="12">support · counter</text>
    </g>
    <g transform="translate(978 132)">
      <rect width="150" height="164" rx="20" fill="#28212F" stroke="#7B6544"/>
      <circle cx="75" cy="48" r="34" fill="#F4C95D" opacity=".12"/>
      <g transform="translate(75 48)" filter="url(#glow)"><path d="M0-17 5-5 17 0 5 5 0 17-5 5-17 0-5-5Z" fill="#F4C95D"/></g>
      <text x="75" y="102" text-anchor="middle" fill="#FFF5D5" font-size="17" font-weight="700">Field state</text>
      <text x="75" y="125" text-anchor="middle" fill="#D7C8A0" font-size="12">frontier opportunity</text>
      <text x="75" y="145" text-anchor="middle" fill="#D7C8A0" font-size="12">next justified step</text>
    </g>

    <path d="M694 284v52H358" fill="none" stroke="#B26F91" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <rect x="358" y="318" width="336" height="72" rx="14" fill="#26182B" stroke="#633752"/>
    <circle cx="386" cy="345" r="8" fill="#F26F8E"/>
    <text x="406" y="349" fill="#F5DDE7" font-size="15" font-weight="650">Failed attempts stay executable</text>
    <text x="386" y="372" fill="#BFA5B1" font-size="12">blockers · invalid runs · refuted paths · uncertainty</text>
    <path d="M694 354h366v-47" fill="none" stroke="#B26F91" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  </g>
</svg>
